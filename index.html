<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@oleksiisedun</title>
  <meta name="description" content="Personal terminal-style portfolio">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mochi.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>

<body>
  <div class="monitor">
    <div class="screen">
      <div id="terminal">
        <div id="output"></div>

        <div class="command-line">
          <span class="prompt"></span>
          <div class="input-container">
            <span id="typer"></span><span class="cursor">&nbsp;</span>
            <input type="text" id="hidden-input" autocomplete="off" autofocus>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="status-bar">
    <div class="status-left">
      <span>Oleksii Sedun</span><br>
      <span>© 2026</span>
    </div>

    <div class="mochi-wrapper">
      <div class="mochi-head">
        <div class="glint"></div>
        <div class="mochi-screen">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
      </div>
    </div>

    <div class="status-right">
      <a id="github-link" href="#" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://www.linkedin.com/in/oleksiisedun/" target="_blank" title="LinkedIn"><i
          class="fab fa-linkedin"></i></a>
      <a href="https://www.instagram.com/oleksiisedun/" target="_blank" title="Instagram"><i
          class="fab fa-instagram"></i></a>
    </div>
  </div>

  <script type="module" src="js/script.js"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</body>

</html>
